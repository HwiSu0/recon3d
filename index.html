<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통로 3D 복원</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/style.css">
<script type="module" src="assets/app.js"></script>
</head>
<body>
<header>
  <h1>통로 3D 복원</h1>
  <nav>
    <button type="button" id="saveHtml" hidden>HTML 저장</button>
    <button type="button" id="saveJson" hidden>JSON 저장</button>
    <a href="https://github.com/HwiSu0/recon3d">GitHub</a>
  </nav>
</header>

<main>
  <aside>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabForm" aria-selected="true">설정</button>
      <button type="button" role="tab" id="tabList" aria-selected="false">결과 <span id="resultCount"></span></button>
    </div>

    <div class="list" id="paneList" hidden>
      <ul id="results"></ul>
      <p class="none" id="noResults">저장된 결과 없음</p>
      <p class="error" id="listError" hidden></p>
      <button type="button" class="text" id="importBtn">결과 HTML 가져오기</button>
      <input type="file" id="importInput" accept=".html,text/html" hidden>
    </div>

    <div class="form" id="paneForm">
      <div class="line">
        <button type="button" id="openCsv">CSV 열기</button>
        <span class="file" id="fileInfo">파일 없음</span>
        <input type="file" id="csvInput" accept=".csv,text/csv" hidden>
      </div>

      <div class="line">
        <select id="preset" aria-label="설정"></select>
        <button type="button" id="openCfg">열기</button>
        <button type="button" id="saveCfg">저장</button>
        <input type="file" id="cfgInput" accept=".json,application/json" hidden>
      </div>

      <div class="fields">
        <label>Run
          <select id="fRunSel" hidden></select>
          <input type="number" id="fRun" min="1" step="1">
        </label>
        <label>철 도착 예상 (s)
          <input type="number" id="fFront" step="any" placeholder="자동">
        </label>
        <div class="field">
          <span id="lblBase">기준 구간 (s)</span>
          <div class="pair">
            <input type="number" id="fBase0" step="any" aria-labelledby="lblBase">
            <input type="number" id="fBase1" step="any" aria-labelledby="lblBase">
          </div>
        </div>
        <div class="field">
          <span id="lblWin">분석 구간 (s)</span>
          <div class="pair">
            <input type="number" id="fWin0" step="any" aria-labelledby="lblWin">
            <input type="number" id="fWin1" step="any" aria-labelledby="lblWin">
          </div>
        </div>
      </div>

      <h2>센서 <small>cm</small></h2>
      <table id="sensorTable">
        <thead><tr><th scope="col"></th><th scope="col">ID</th><th scope="col">a</th><th scope="col">b</th><th scope="col">c</th><th scope="col">뺄 구간</th></tr></thead>
        <tbody></tbody>
      </table>

      <h2>입구와 출구 <small>cm, 유량 mL/s</small></h2>
      <table id="portTable">
        <thead><tr><th scope="col"></th><th scope="col">a</th><th scope="col">b</th><th scope="col">c</th><th scope="col">유량</th><th scope="col"><span class="sr">삭제</span></th></tr></thead>
        <tbody></tbody>
      </table>
      <button type="button" class="text" id="addOutlet">출구 추가</button>

      <div class="fields">
        <label>구조
          <select id="fTopo">
            <option value="auto">자동 선택</option>
            <option value="single">한 줄 관</option>
            <option value="step">굵기 변화</option>
            <option value="loop">합류 관</option>
            <option value="y">Y자</option>
          </select>
        </label>
        <label>출구
          <select id="fExit"></select>
        </label>
        <label>입구 쪽 내경 (mm)
          <input type="number" id="fStem" step="any" min="0">
        </label>
        <label>뒤쪽, 갈래 내경 (mm)
          <input type="text" id="fBranches" autocomplete="off">
        </label>
        <label>입구 앞 호스 (cm)
          <input type="number" id="fUp" step="any" min="0">
        </label>
        <label>출구 뒤 호스 (cm)
          <input type="number" id="fOut" step="any" min="0">
        </label>
      </div>

      <label class="check"><input type="checkbox" id="fTruth">실제 경로와 비교</label>

      <details>
        <summary>JSON</summary>
        <textarea id="cfgText" rows="14" spellcheck="false" aria-label="설정 JSON"></textarea>
        <p class="error" id="cfgError" hidden></p>
      </details>
    </div>

    <div class="run">
      <div class="problems" id="problems" role="status"></div>
      <div class="line">
        <button type="button" class="go" id="runBtn">복원 시작</button>
        <button type="button" id="stopBtn" hidden>중단</button>
      </div>
      <div class="progress" id="progress" hidden>
        <div class="bar"><i id="bar"></i></div>
        <p><span id="stageText" aria-live="polite"></span><span id="clock"></span></p>
      </div>
      <p class="error" id="runError" role="alert" hidden></p>
      <details id="logBox" hidden>
        <summary>기록</summary>
        <pre id="log" tabindex="0"></pre>
      </details>
    </div>
  </aside>

  <section id="result" aria-label="복원 결과">
    <iframe id="viewer" title="복원 결과" sandbox="allow-scripts" hidden></iframe>
    <p id="empty">결과 없음</p>
  </section>
</main>
</body>
</html>
