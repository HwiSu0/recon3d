<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통로 3D 복원</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
:root{
  --bg:#fff; --panel:#fff; --ink:#1c1c1c; --muted:#767676; --line:#e3e3e3; --grid:#efefef;
  --scene:#d8dbde; --b1:#2463c9; --b2:#d2691e; --b3:#2e8b57; --stem:#3b3a36; --truth:#2f9e57; --sensor:#7a3fb0;
  --c0:#1c1c1c; --c1:#2463c9; --c2:#d2691e; --good:#1c1c1c; --bad:#b3261e;
  --label-bg:rgba(255,255,255,.9); --label-ink:#1c1c1c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161616; --panel:#161616; --ink:#e6e6e6; --muted:#939393; --line:#2e2e2e; --grid:#242424;
    --scene:#1d1f22; --b1:#6ea0ff; --b2:#f0954a; --b3:#5cc48c; --stem:#d6d4cc; --truth:#5cc48c; --sensor:#c08cf0;
    --c0:#e6e6e6; --c1:#6ea0ff; --c2:#f0954a; --good:#e6e6e6; --bad:#f28b82;
    --label-bg:rgba(28,29,32,.88); --label-ink:#e6e6e6;
  }
}
:root[data-theme="dark"]{
  --bg:#161616; --panel:#161616; --ink:#e6e6e6; --muted:#939393; --line:#2e2e2e; --grid:#242424;
  --scene:#1d1f22; --b1:#6ea0ff; --b2:#f0954a; --b3:#5cc48c; --stem:#d6d4cc; --truth:#5cc48c; --sensor:#c08cf0;
  --c0:#e6e6e6; --c1:#6ea0ff; --c2:#f0954a; --good:#e6e6e6; --bad:#f28b82;
  --label-bg:rgba(28,29,32,.88); --label-ink:#e6e6e6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
h1{margin:0;padding:10px 12px;font-size:13px;font-weight:600}
h2{margin:0 0 8px;font-size:12px;font-weight:600}
h3{margin:0 0 2px;font-size:12px;font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.side{padding:6px 12px 12px;border-left:1px solid var(--line)}
@media (max-width:760px){.side{border-left:0;border-top:1px solid var(--line)}}
section{padding:12px;border-bottom:1px solid var(--line)}
section:last-child{border-bottom:0}
#stage{position:relative;width:100%;height:68vh;min-height:320px;overflow:hidden;background:var(--scene);touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#gl{width:100%;height:100%;display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{--lift:0px;position:absolute;transform:translate(-50%,calc(-100% - 12px - var(--lift)));white-space:nowrap;font-size:11px;line-height:1.25;padding:2px 6px;border-radius:3px;background:var(--label-bg);color:var(--label-ink);box-shadow:0 1px 3px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.08);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.lb::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:calc(9px + var(--lift));background:currentColor;opacity:.4}
.lb::before{content:"";position:absolute;left:calc(50% - 2px);top:calc(100% + 8px + var(--lift));width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75}
.lb.below{transform:translate(-50%,calc(12px + var(--lift)))}
.lb.below::after{top:auto;bottom:100%}
.lb.below::before{top:auto;bottom:calc(100% + 8px + var(--lift))}
.lb.key{font-weight:600}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(0,0,0,.10) 100%)}
#labels{z-index:1}
.lb small{color:var(--muted);font-weight:400}
#nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
#nogl[hidden]{display:none}
#view{width:100%;height:auto;aspect-ratio:4/3;display:block}
#view[hidden]{display:none}
.ctrl{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:6px 12px;border-top:1px solid var(--line)}
.grp{display:inline-flex}
.grp button{margin-left:-1px}
.grp button:first-child{margin-left:0}
button{height:24px;padding:0 8px;font:inherit;font-size:12px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:0;cursor:pointer}
button:hover{background:var(--grid)}
label{font-size:12px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
label input{margin:0;accent-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.side .legend{margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:14px;height:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:4px 0;border-bottom:1px solid var(--grid);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--muted);padding-right:8px}
td.num{font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--muted)}
.note{margin:6px 0 0;font-size:12px;color:var(--muted)}
.traces{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:8px}
.tr svg{width:100%;height:auto;display:block}
.good{color:var(--good)} .bad{color:var(--bad)}
.thick{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.thick{grid-template-columns:1fr}}
#thickTable th{font-weight:400;color:var(--muted);text-align:left;padding:0 8px 3px 0;border-bottom:1px solid var(--line);white-space:nowrap}
#thickTable td{padding-right:8px;white-space:nowrap}
#thickTable td:first-child{white-space:normal}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <div class="grid">
    <div>
      <div id="stage"><canvas id="gl"></canvas><div id="labels"></div><div id="nogl" hidden></div></div>
      <svg id="view" viewBox="0 0 640 480" hidden role="img" aria-label="복원된 통로 그림"></svg>
      <div class="ctrl">
        <span class="grp"><button data-v="iso">기본</button><button data-v="top">위</button><button data-v="front">앞</button><button data-v="side">입구 쪽</button><button data-v="out">출구 쪽</button></span>
        <span class="grp"><button data-f="J">분기점</button><button data-f="in">입구</button><button data-f="out">출구</button></span>
        <label><input type="checkbox" id="tBox" checked>상자</label>
        <label><input type="checkbox" id="tCoil" checked>장치</label>
        <label><input type="checkbox" id="tSensor" checked>센서</label>
        <label><input type="checkbox" id="tTruth" checked>실제 경로</label>
        <label><input type="checkbox" id="tAlt" checked>다른 후보</label>
        <label><input type="checkbox" id="tLab" checked>이름표</label>
      </div>
    </div>
    <div class="side">
      <table id="sum"></table>
      <div class="legend" id="legend"></div>
    </div>
  </div>
  <section id="thickCard" hidden>
    <h2>호스 내경</h2>
    <div class="thick">
      <div><table id="thickTable"></table><p class="note" id="thickNote"></p></div>
      <div class="tr" id="thickPlot"></div>
    </div>
  </section>
  <section>
    <h2>센서별 ΔB (μT)</h2>
    <div class="legend">
      <span><i class="sw" style="background:var(--c0)"></i>코일 방향</span>
      <span><i class="sw" style="background:var(--c1)"></i>수직 1</span>
      <span><i class="sw" style="background:var(--c2)"></i>수직 2</span>
      <span>옅은 선: 측정, 진한 선: 모델</span>
    </div>
    <div class="traces" id="traces"></div>
  </section>
</div>
<script>
const D = __DATA__;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const f1 = x => (Math.round(x * 10) / 10).toFixed(1);
const fp = p => `(${p.map(f1).join(', ')})`;
const G = D.geom || {};
const S = D.summary, nb = S.U.length, LOOP = D.topology === 'loop', STEP = D.topology === 'step', GRAPH = D.topology === 'graph';
const UNC = S.uncertainty || {}, KEYPT = { J: GRAPH ? '갈라지는 점' : (LOOP ? '분기점 J1' : '분기점'), J2: GRAPH ? '합쳐지는 점' : '합류점 J2', P: '굵기 바뀌는 점' };
const pm = k => UNC[k] ? ` <span class="meta">±(${UNC[k].sd.map(f1).join(', ')})</span>` : '';
const names = LOOP ? ['갈래1', '갈래2'] : (D.outlet_names || []);
const hoseMM = G.hose_mm || { stem: 3, branches: Array(nb).fill(3) };
document.getElementById('title').textContent = D.title;

// ---------- 추정 굵기 (lambda 비로) ----------
const estD = S.lam.map(l => (S.lam0 > 1e-6 && l > 0) ? hoseMM.stem * Math.sqrt(l / S.lam0) : null);

// ---------- summary ----------
const rows = [];
rows.push(['χ²/N', `${S.chi2_per_N.toFixed(2)} <span class="meta">(철 없음 ${S.chi2_per_N_no_iron_model.toFixed(2)})</span>`]);
if (S.fit_window) rows.push(['맞춘 구간', `${S.fit_window[0]}~${S.fit_window[1]} s`]);
if (S.baseline) rows.push(['기준 구간', `${S.baseline[0]}~${S.baseline[1]} s`]);
if (S.knocks && S.knocks.length) {
  const span = S.knocks.map(([a, b]) => `${a.toFixed(1)}~${b.toFixed(1)} s`).join(', ');
  rows.push(['충격', `${span} <span class="meta">(센서가 흔들린 구간. 값의 어긋남을 없애고 맞춤에서 뺌)</span>`]);
  if (S.knocks.some(([a, b]) => b > S.fit_window[0] && a < S.fit_window[1])) rows.push(['주의', `<span class="bad">맞춘 구간 안에 충격이 있어 이 구간의 값은 덜 정확할 수 있음</span>`]);
}
if (S.topology_compare) rows.push(['구조', S.topology_compare.map((r, i) => `${i === 0 ? '<b>' : ''}${r.name}${r.flat ? ' (굵기 변화 없음)' : ''}${r.limit ? (r.limit_kept ? ' (탐색 범위 끝이지만 훨씬 잘 맞아 남김)' : ' (탐색 범위 끝)') : ''}${r.dup ? ' (같은 구조는 후보 맞춤 답을 씀)' : ''}: χ²/N ${r.rough ? '약 ' : ''}${r.chi2_per_N.toFixed(2)}, 점수 ${r.score.toFixed(0)}${i === 0 ? '</b>' : ''}`).join('<br>')]);
if (S.grow_history && S.grow_history.length) rows.push(['구조 키우기', S.grow_history.map(h => `${h.step}단계 ${h.added}: χ²/N ${h.chi2_per_N.toFixed(2)}${h.gain !== undefined ? `, 보정 개선량 ${h.gain.toFixed(0)}` : ''}`).join('<br>')]);
if (S.topology_compare && S.chi2_per_N > 2) rows.push(['주의', `<span class="bad">χ²/N이 커서 구조 선택을 믿기 어려움</span>`]);
(S.sensors_swapped || []).forEach(([a, b]) => rows.push(['주의', `<span class="bad">코일 자기장 크기로 보면 ${a}와 ${b}의 위치나 ID가 서로 바뀐 것 같음</span>`]));
if (S.at_limit) rows.push(['주의', `<span class="bad">속도나 앞머리 폭이 탐색 범위 끝에 걸림. 앞머리가 너무 빨라 경로 정보가 부족할 수 있음</span>`]);
const ranked = (S.topology_compare || []).filter(r => !r.flat && (!r.limit || r.limit_kept) && !r.dup);
if (S.topology_compare && S.topology_compare[0].limit) rows.push(['주의', `<span class="bad">고른 답의 속도나 앞머리 폭이 탐색 범위 끝에 걸림. 경로 모양은 믿을 만하지만 속도 값은 믿기 어려움</span>`]);
if (ranked.length > 1 && ranked[1].score - ranked[0].score < 10) rows.push(['주의', `<span class="bad">앞선 두 후보의 점수 차이가 10보다 작아 구조를 정할 수 없음</span>`]);
if (GRAPH) rows.push(['찾은 부품 (입구부터)', (S.features || []).filter(f => !f.type.startsWith('곡선')).map(f => `${f.type} ${fp(f.p)}${f.ratio ? ` · 굵기 ×${f.ratio.toFixed(2)}` : ''}${f.at_inlet ? ' (입구에서)' : ''}${f.at_outlet ? ' (출구에서)' : ''}`).join('<br>') || '없음 (휘어진 한 줄 관)']);
if (S.J) rows.push([KEYPT.J, fp(S.J) + pm('J')]);
if (S.J2) rows.push([KEYPT.J2, fp(S.J2) + pm('J2')]);
if ((STEP || GRAPH) && S.P) { rows.push([KEYPT.P + (STEP ? ' P' : ''), fp(S.P) + pm('P')]); if (STEP) rows.push(['입구→P', `${f1(S.step_s_cm)} cm`]); }
if (!GRAPH) S.C.forEach((c, k) => rows.push([`중간점 ${names[k] || k + 1}`, fp(c) + pm(`C${k + 1}`)]));
if (Object.keys(UNC).length) rows.push(['± 범위', '<span class="meta">측정 잡음만 따졌을 때 점이 흔들리는 범위(1σ, a·b·c cm). 센서 위치 오차 같은 다른 오차는 들어 있지 않음</span>']);
if (nb >= 2) rows.push(['입구→분기점', `${f1(S.stem_len_cm)} cm`]);
S.branch_len_cm.forEach((L, k) => rows.push([`길이 ${names[k] || k + 1}`, `${f1(L)} cm`]));
if (S.merge_len_cm !== undefined) rows.push(['합류점→출구', `${f1(S.merge_len_cm)} cm`]);
rows.push(['속도 입구 쪽', `${S.U0.toFixed(2)} cm/s`]);
S.U.forEach((u, k) => rows.push([`속도 ${names[k] || k + 1}`, `${u.toFixed(2)} cm/s`]));
rows.push(['입구 도착', `${S.t0.toFixed(1)} s`]);
rows.push(['λ', [S.lam0, ...S.lam].map(x => x.toFixed(3)).join(' / ')]);
if (S.flow_split) rows.push(['유량비', S.flow_split.map(x => (x * 100).toFixed(0) + '%').join(' : ')]);
if (S.truth_error_cm) {
  const lab = nb >= 2 ? ['입구→분기점', ...names] : [names[0] || '통로'];
  S.truth_error_cm.forEach((e, i) => rows.push([`경로 오차 ${lab[i] || i}`, `평균 ${e.mean.toFixed(2)}, 최대 ${e.max.toFixed(2)} cm`]));
}
if (S.truth_point_error_cm) Object.entries(S.truth_point_error_cm).forEach(([k, v]) => rows.push([`실제와 차이: ${KEYPT[k] || k}`, `${v.toFixed(2)} cm` +
  (S.truth_point_sigma && S.truth_point_sigma[k] !== undefined ? ` <span class="meta">(± 범위의 ${S.truth_point_sigma[k].toFixed(0)}배${S.truth_point_sigma[k] > 3 ? ': 잡음보다 훨씬 커서 모형과 장치가 다른 것' : ''})</span>` : '')]));
if (S.sensor_check) {
  rows.push(['센서 점검', S.sensor_check.map(c => `${c.k} 측정/계산 ${c.ratio.toFixed(3)}${c.warn ? ` <span class="bad">(다른 센서보다 ${c.dev_pct > 0 ? '+' : ''}${c.dev_pct.toFixed(1)}%${c.da_cm !== null ? `, a를 ${c.da_cm > 0 ? '+' : ''}${c.da_cm.toFixed(1)} cm 옮기면 맞음` : ''})</span>` : ''}`).join('<br>') +
    '<br><span class="meta">철 없을 때 잰 코일 자기장 ÷ 계산값. 센서끼리 비가 3% 넘게 다르면 그 센서 위치(주로 a)를 다시 재 보기</span>']);
}
if (S.chi2_per_N_truth_path) rows.push(['χ²/N 실제 경로', S.chi2_per_N_truth_path.toFixed(2)]);
document.getElementById('sum').innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td class="num">${r[1]}</td></tr>`).join('');
// ---------- legend ----------
const brCol = ['--b1', '--b2', '--b3'];
const lg = [];
if (STEP) { lg.push(['--b1', '굵기 바뀌기 전']); lg.push(['--b2', '굵기 바뀐 뒤']); }
else if (GRAPH) { lg.push(['--b1', '한 줄 구간 (굵기는 철 양 비로 추정)']); lg.push(['--b2', '다음 구간']); lg.push(['--b3', '갈래']); }
else {
  if (nb >= 2) lg.push(['--stem', LOOP ? '입구 쪽, 합류 뒤' : '입구→분기점']);
  for (let k = 0; k < nb; k++) lg.push([nb >= 2 ? brCol[k % 3] : '--b1', names[k] || `갈래${k + 1}`]);
}
if (D.truth) lg.push(['--truth', '실제 경로']);
if (D.truth_points) lg.push(['--truth', '실제 점 (초록 공)']);
if (Object.keys(UNC).some(k => !k.startsWith('C'))) lg.push(['--b2', '주황 안개: 잡음만 따진 ± 범위']);
document.getElementById('legend').innerHTML = lg.map(([c, t]) => `<span><i class="sw" style="background:var(${c})"></i>${t}</span>`).join('');
if (nb < 2) document.querySelector('[data-f="J"]').textContent = STEP ? 'P' : '중간점';

// ---------- vector helpers ----------
const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s], dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]), norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
};
const W = p => [p[0], p[2], -p[1]];                 // (a,b,c) -> 화면 세계 좌표 (x=a, y=c, z=-b)
const Wd = d => [d[0], d[2], -d[1]];
const hex2rgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); const n = parseInt(h, 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
const cssRGB = n => hex2rgb(css(n) || '#888888');

// ---------- 3D: 공통 모양 ----------
const canvas = document.getElementById('gl');
const pushV = (o, p, n) => { o.push(p[0], p[1], p[2], n[0], n[1], n[2]); };
function quad(o, a, b, c, d, n) { pushV(o, a, n); pushV(o, b, n); pushV(o, c, n); pushV(o, a, n); pushV(o, c, n); pushV(o, d, n); }

// ---- 관 (parallel transport frame) ----
function tube(pts, r, seg = 20, caps = true) {
  const o = [], nP = pts.length; if (nP < 2) return o;
  const T = pts.map((p, i) => V3.norm(V3.sub(pts[Math.min(i + 1, nP - 1)], pts[Math.max(i - 1, 0)])));
  let N = V3.norm(V3.cross(T[0], Math.abs(T[0][1]) < 0.9 ? [0, 1, 0] : [1, 0, 0]));
  const rings = [];
  for (let i = 0; i < nP; i++) {
    if (i > 0) { N = V3.norm(V3.sub(N, V3.mul(T[i], V3.dot(N, T[i])))); }
    const B = V3.cross(T[i], N); const ring = [];
    for (let j = 0; j <= seg; j++) { const th = 2 * Math.PI * j / seg; const d = V3.add(V3.mul(N, Math.cos(th)), V3.mul(B, Math.sin(th))); ring.push([V3.add(pts[i], V3.mul(d, r)), d]); }
    rings.push(ring);

  const key = new T.DirectionalLight('#fff6ea', dark ? 1.4 : 1.7);
  key.position.set(center[0] - 16, center[1] + 34, center[2] + 22); key.target.position.set(...center);
  key.castShadow = true; key.shadow.mapSize.set(3072, 3072); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
  Object.assign(key.shadow.camera, { left: -36, right: 36, top: 36, bottom: -36, near: 5, far: 130 }); key.shadow.radius = 4;
  scene.add(key, key.target);
  const rim = new T.DirectionalLight('#dfe8ff', dark ? 0.7 : 0.9); rim.position.set(center[0] + 20, center[1] + 12, center[2] - 26); scene.add(rim);
  scene.add(new T.HemisphereLight('#ffffff', dark ? '#202124' : '#a9a49b', dark ? 0.12 : 0.15));

  // ---- 카메라와 손으로 돌리기 ----
  const camera = new T.PerspectiveCamera(32, 1, 0.3, 800);
  const controls = new OrbitControls(camera, canvas);
  Object.assign(controls, { enableDamping: true, dampingFactor: 0.09, rotateSpeed: 0.75, zoomSpeed: 0.9, panSpeed: 0.8, screenSpacePanning: true,
    minDistance: diag * 0.12, maxDistance: diag * 9, maxPolarAngle: Math.PI / 2 - 0.015 });
  const place = (yaw, pitch, dist, tg) => {
    controls.target.set(...tg);
    camera.position.set(tg[0] + dist * Math.cos(pitch) * Math.sin(yaw), tg[1] + dist * Math.sin(pitch), tg[2] + dist * Math.cos(pitch) * Math.cos(yaw));
  };
  const now = () => { const v = camera.position.clone().sub(controls.target), d = v.length(); return [Math.atan2(v.x, v.z), Math.asin(Math.max(-1, Math.min(1, v.y / d))), d, controls.target.toArray()]; };
  let tween = null;
  const go = (yaw, pitch, dist, tg) => {
    const [y0, p0, d0, t0] = now(); let dy = yaw - y0; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    tween = { t: performance.now(), dur: 650, f: s => place(y0 + dy * s, p0 + (pitch - p0) * s, d0 * Math.pow(dist / d0, s), t0.map((v, i) => v + (tg[i] - v) * s)) };
  };
  const home = diag * 3.7;
  place(VIEWS.iso[0], VIEWS.iso[1], home, center); controls.update();

  // ---- 이름표 ----
  const labDiv = document.getElementById('labels');
  labels.forEach(l => { const el = document.createElement('div'); el.className = 'lb' + (l.key ? ' key' : '') + (l.below ? ' below' : ''); el.innerHTML = l.html; if (l.color) el.style.color = l.color; labDiv.appendChild(el); l.el = el; });
  const show = { box: true, coil: true, sensor: true, truth: true, alt: true, lab: true, hose: true, base: true };
  const apply = () => Object.entries(groups).forEach(([k, g]) => { g.visible = k === 'nocoil' ? !show.coil : k === 'sensorRig' ? show.sensor && show.coil : show[k] !== false; });
  const pv = new T.Vector3();

  let cw = 1, ch = 1;
  function resize() {
    cw = canvas.clientWidth || 1; ch = canvas.clientHeight || 1;
    renderer.setSize(cw, ch, false); camera.aspect = cw / ch; camera.updateProjectionMatrix(); need = true;
  }
  const ray = new T.Ray(), hit = new T.Vector3();
  function render() {
    const d = camera.position.distanceTo(controls.target);
    // 센서 몸체가 보는 곳을 가리면 흐리게 한다
    ray.origin.copy(camera.position); ray.direction.copy(controls.target).sub(camera.position).normalize();
    sensorMeshes.forEach(m => {
      const block = show.sensor && !!ray.intersectBox(m.box, hit) && hit.distanceTo(camera.position) < d - 0.3 && !m.box.containsPoint(controls.target);
      if (block === !!m.faded) return;
      m.faded = block; const mt = m.body.material;
      mt.transparent = block; mt.opacity = block ? 0.18 : 1; mt.depthWrite = !block; mt.needsUpdate = true;
      m.body.castShadow = !block; m.parts.forEach(p => { p.visible = !block; });
    });
    // 코일 고리가 보는 곳을 가리면 흐리게 한다
    coilParts.forEach(c => {
      let block = false;
      if (show.coil && Math.abs(ray.direction.x) > 1e-6) {
        const t = (c.c[0] - ray.origin.x) / ray.direction.x;
        if (t > 0 && t < d - 0.3) { const y = ray.origin.y + t * ray.direction.y - c.c[1], z = ray.origin.z + t * ray.direction.z - c.c[2], r = Math.hypot(y, z); block = r > c.R - 2.2 && r < c.R + 1.6; }
      }
      if (block === !!c.faded) return;
      c.faded = block; c.mats.forEach(mt => { mt.transparent = block; mt.opacity = block ? 0.15 : 1; mt.depthWrite = !block; mt.needsUpdate = true; });
    });
    scene.fog.near = d * 1.6; scene.fog.far = d * 5;
    renderer.render(scene, camera);
    const placed = [];
    labels.forEach(l => {
      pv.set(...l.p).project(camera);
      const on = show.lab && pv.z < 1 && (l.group !== 'coil' || show.coil) && (l.group !== 'truth' || show.truth) && (l.group !== 'sensor' || show.sensor);
      l.el.style.display = on ? '' : 'none'; if (!on) return;
      const x = (pv.x + 1) / 2 * cw, y = (1 - pv.y) / 2 * ch;
      if (!l.w) { l.w = l.el.offsetWidth; l.h = l.el.offsetHeight; }
      let lift = 0;            // 다른 이름표와 겹치면 끈을 늘여 비켜 놓는다 (위에 다는 것은 위로, 아래에 다는 것은 아래로)
      const body = () => l.below ? [y + 12 + lift, y + 12 + lift + l.h] : [y - 12 - lift - l.h, y - 12 - lift];
      for (let n = 0; n < 6; n++) {
        const [t0, t1] = body(), hit = placed.find(r => Math.abs(r.x - x) < (r.w + l.w) / 2 + 3 && t0 < r.bottom + 2 && t1 + 2 > r.top);
        if (!hit) break; lift += l.below ? hit.bottom + 3 - t0 : t1 - (hit.top - 3);
      }
      const [t0, t1] = body(); placed.push({ x, w: l.w, top: l.below ? y : t0, bottom: l.below ? t1 : y });
      l.el.style.left = x.toFixed(1) + 'px'; l.el.style.top = y.toFixed(1) + 'px'; l.el.style.setProperty('--lift', lift.toFixed(0) + 'px');
    });
  }
  let need = true, running = true;
  controls.addEventListener('change', () => { need = true; });
  function frame(t) {
    if (tween) { const s = Math.min(1, (t - tween.t) / tween.dur); tween.f(s < 0.5 ? 4 * s * s * s : 1 - Math.pow(-2 * s + 2, 3) / 2); if (s >= 1) tween = null; need = true; }
    if (controls.update()) need = true;
    if (need) { render(); need = false; }
    if (running) requestAnimationFrame(frame);
  }
  apply(); resize();
  new ResizeObserver(resize).observe(canvas);
  document.addEventListener('visibilitychange', () => { const was = running; running = !document.hidden; if (running && !was) requestAnimationFrame(frame); });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  requestAnimationFrame(frame);

  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { const v = VIEWS[b.dataset.v]; go(v[0], Math.min(v[1], Math.PI / 2 - 0.02), home, center); });
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { const f = b.dataset.f, v = fview[f]; go(v[0], v[1], v[2], focus[f]); });
  const tg = (id, k) => document.getElementById(id).onchange = e => { show[k] = e.target.checked; apply(); need = true; };
  tg('tBox', 'box'); tg('tCoil', 'coil'); tg('tSensor', 'sensor'); tg('tTruth', 'truth'); tg('tAlt', 'alt'); tg('tLab', 'lab');
  if (!D.truth && !D.truth_points) document.getElementById('tTruth').parentElement.style.display = 'none';
  if (!D.alt.length) document.getElementById('tAlt').parentElement.style.display = 'none';
  window.__ready3d = true;
}

// ---------- 3D 시작: three.js를 불러오면 실제처럼, 못 불러오면 예전 방식, WebGL이 없으면 선 그림 ----------
{
  const wait = document.getElementById('nogl'); wait.hidden = false; wait.textContent = '3D 불러오는 중';
  loadThree().then(m => {
    wait.hidden = true;
    try { startThree(m); } catch (e) { console.error(e); startFallback(); }
  }, e => { console.warn(e); wait.hidden = true; start3D(); });
}

// ---------- WebGL을 못 쓸 때: 간단한 선 그림 ----------
function startFallback() {
  document.getElementById('stage').hidden = true; const svg = document.getElementById('view'); svg.hidden = false;
  const NS = 'http://www.w3.org/2000/svg', Wd = 640, Hd = 480, B = D.box;
  const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const all = [[B.a[0], B.b[0], B.c[0]], [B.a[1], B.b[1], B.c[1]], D.inlet, ...D.outlets, ...Object.values(D.sensors)];
  const lo = [0, 1, 2].map(i => Math.min(...all.map(p => p[i]))), hi = [0, 1, 2].map(i => Math.max(...all.map(p => p[i])));
  const ctr = lo.map((l, i) => (l + hi[i]) / 2), dg = Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]);
  const yaw = 0.6, pitch = 0.45;
  const pr = p => { const x = p[0] - ctr[0], y = p[1] - ctr[1], z = p[2] - ctr[2]; const x1 = x * Math.cos(yaw) - y * Math.sin(yaw), y1 = x * Math.sin(yaw) + y * Math.cos(yaw);
    const z2 = z * Math.cos(pitch) + y1 * Math.sin(pitch); const s = Math.min(Wd, Hd) / dg * 0.95; return [Wd / 2 + x1 * s, Hd / 2 - z2 * s]; };
  const line = (pts, a) => el('polyline', { points: pts.map(p => pr(p).join(',')).join(' '), fill: 'none', ...a }, svg);
  const cols = ['--stem', '--b1', '--b2', '--b3'];
  D.best.forEach((pl, i) => line(pl, { stroke: css(nb >= 2 ? cols[i] : '--b1'), 'stroke-width': 4 }));
  if (D.truth) D.truth.forEach(pl => line(pl, { stroke: css('--truth'), 'stroke-width': 2, 'stroke-dasharray': '6 4' }));
  Object.entries(D.sensors).forEach(([k, p]) => { const q = pr(p); const t = el('text', { x: q[0] + 6, y: q[1] - 6, fill: css('--sensor'), 'font-size': 13 }, svg); t.textContent = k; });
  const ng = document.createElement('p'); ng.className = 'note'; ng.textContent = 'WebGL 사용 불가: 선 그림으로 표시'; svg.after(ng);
}

// ---------- traces ----------
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))); const m = x / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }
function drawTraces() {
  const NS = 'http://www.w3.org/2000/svg'; const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const box = document.getElementById('traces'); box.innerHTML = '';
  const t = D.t, w = 520, h = 210, L = 44, R = 10, T = 10, Bm = 28;
  Object.entries(D.traces).forEach(([k, tr]) => {
    const div = document.createElement('div'); div.className = 'tr';
    div.innerHTML = `<h3>${k} <span class="meta">σ ${tr.noise}</span></h3>`;
    const s = el('svg', { viewBox: `0 0 ${w} ${h}`, role: 'img', 'aria-label': `${k} 측정과 모델` });
    const vals = [...tr.meas.flat(), ...tr.model.flat()].filter(v => v !== null);
    let ymin = Math.min(0, ...vals), ymax = Math.max(0, ...vals); const pad = (ymax - ymin) * 0.08 || 0.2; ymin -= pad; ymax += pad;
    const X = x => L + (x - t[0]) / (t[t.length - 1] - t[0]) * (w - L - R), Y = y => T + (ymax - y) / (ymax - ymin) * (h - T - Bm);
    const step = niceStep((ymax - ymin) / 4);
    for (let y = Math.ceil(ymin / step) * step; y <= ymax; y += step) {
      el('line', { x1: L, x2: w - R, y1: Y(y), y2: Y(y), stroke: css(Math.abs(y) < 1e-9 ? '--line' : '--grid'), 'stroke-width': 1 }, s);
      const tx = el('text', { x: L - 6, y: Y(y) + 4, 'text-anchor': 'end', 'font-size': 11, fill: css('--muted') }, s); tx.textContent = +y.toFixed(2);
    }
    const ts = niceStep((t[t.length - 1] - t[0]) / 6);
    for (let x = Math.ceil(t[0] / ts) * ts; x <= t[t.length - 1]; x += ts) {
      const tx = el('text', { x: X(x), y: h - 8, 'text-anchor': 'middle', 'font-size': 11, fill: css('--muted') }, s); tx.textContent = Math.round(x) + 's';
    }
    const path = arr => { let d = '', pen = false; arr.forEach((v, i) => { if (v === null) { pen = false; return; } d += (pen ? 'L' : 'M') + X(t[i]).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; }); return d; };
    ['--c0', '--c1', '--c2'].forEach((c, j) => {
      el('path', { d: path(tr.meas[j]), fill: 'none', stroke: css(c), 'stroke-width': 1.2, opacity: 0.35 }, s);
      el('path', { d: path(tr.model[j]), fill: 'none', stroke: css(c), 'stroke-width': 2.2 }, s);
    });
    div.appendChild(s); box.appendChild(div);
  });
}
drawTraces();

// ---------- 호스 안지름 추정 ----------
function drawThickness() {
  const T = S.thickness; if (!T) return;
  const card = document.getElementById('thickCard'), table = document.getElementById('thickTable'), note = document.getElementById('thickNote');
  card.hidden = false;
  if (T.error) { note.textContent = `추정 실패: ${T.error}`; return; }
  const cell = v => `<td class="num">${v}</td>`;
  const head = `<tr><th scope="col"></th><th scope="col">U (cm/s)</th><th scope="col">Q (mL/s)</th><th scope="col">내경 (mm)</th><th scope="col">설정</th></tr>`;
  const body = T.pieces.map(p => {
    const speed = p.resolved ? `${p.U.toFixed(2)} ± ${p.U_err.toFixed(2)}` : '<span class="bad">판정 불가</span>';
    const d = p.d_mm !== undefined ? `<b>${p.d_mm.toFixed(2)} ± ${p.d_err_mm.toFixed(2)}</b>` : '-';
    return `<tr><td>${p.name}</td>${cell(speed)}${cell(p.Q_mL_s ? p.Q_mL_s.toFixed(3) : '-')}${cell(d)}${cell(p.d_set_mm === null || p.d_set_mm === undefined ? '-' : p.d_set_mm)}</tr>`;
  }).join('');
  const ratio = (T.from_signal_ratio || []).map(r => `<tr><td>${r.name} λ비</td>${cell('')}${cell('')}${cell(r.resolved ? `${r.d_mm.toFixed(2)} ± ${r.d_err_mm.toFixed(2)}` : '<span class="bad">판정 불가</span>')}${cell('')}</tr>`).join('');
  table.innerHTML = head + body + ratio;
  note.textContent = `d = 2√(Q/πU), 맞춤 구간 ${T.window[0]}~${T.window[1]} s, ${T.path}, Q 오차 ${Math.round(T.flow_rel_err * 100)}%`;

  // 속도별 맞춤 그래프
  const NS = 'http://www.w3.org/2000/svg', w = 520, h = 230, L = 44, R = 10, Tp = 10, Bm = 34;
  const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const box = document.getElementById('thickPlot');
  box.innerHTML = '<h3>속도별 Δχ² <span class="meta">점선 3σ</span></h3>';
  const s = el('svg', { viewBox: `0 0 ${w} ${h}`, role: 'img', 'aria-label': '앞머리 속도에 따른 chi 제곱 변화' }, box);
  const us = T.pieces[0].profile.U, x0 = Math.log(us[0]), x1 = Math.log(us[us.length - 1]);
  const peak = Math.max(30, ...T.pieces.flatMap(p => p.profile.dchi2));
  const X = u => L + (Math.log(u) - x0) / (x1 - x0) * (w - L - R), Y = v => Tp + (1 - Math.sqrt(Math.max(v, 0) / peak)) * (h - Tp - Bm);
  [0.3, 1, 3, 10, 30].forEach(u => {
    el('line', { x1: X(u), x2: X(u), y1: Tp, y2: h - Bm, stroke: css('--grid'), 'stroke-width': 1 }, s);
    const t = el('text', { x: X(u), y: h - Bm + 16, 'text-anchor': 'middle', 'font-size': 11, fill: css('--muted') }, s); t.textContent = u;
  });
  const xl = el('text', { x: (L + w - R) / 2, y: h - 4, 'text-anchor': 'middle', 'font-size': 11, fill: css('--muted') }, s); xl.textContent = 'U (cm/s)';
  [0, 9, 100, 400].filter(v => v <= peak).forEach(v => {
    const t = el('text', { x: L - 6, y: Y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: css('--muted') }, s); t.textContent = v;
  });
  el('line', { x1: L, x2: w - R, y1: Y(9), y2: Y(9), stroke: css('--muted'), 'stroke-width': 1, 'stroke-dasharray': '5 4' }, s);
  const cols = T.pieces.length === 1 ? ['--b1'] : ['--stem', '--b1', '--b2', '--b3'];
  T.pieces.forEach((p, i) => {
    const col = css(cols[i % cols.length]);
    const d = p.profile.U.map((u, j) => (j ? 'L' : 'M') + X(u).toFixed(1) + ' ' + Y(p.profile.dchi2[j]).toFixed(1)).join('');
    el('path', { d, fill: 'none', stroke: col, 'stroke-width': 2.2 }, s);
    if (p.resolved) el('circle', { cx: X(p.U), cy: Y(0), r: 4, fill: col }, s);
  });
}
drawThickness();
